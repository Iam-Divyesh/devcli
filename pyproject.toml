[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcli"
version = "0.1.0"
description = "Interactive CLI to scaffold AI production projects using uv"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
dev = "devcli.main:app"

[tool.uv.workspace]
members = [
    "myapp",
    "devcli-app",
    "sample-project",
    "sample-folder",
]
